<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajedrez</title>
<!-- Sotos — Ajedrez con motor propio · © 2026 Sebastian Sotomontes -->
<link rel="stylesheet" href="../comun/apps.css">
<style>
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
  .stage { min-height: 0; display: grid; place-items: center; padding: 16px; container-type: size; }
  .wrap { display: grid; grid-template-columns: 14px auto; gap: 8px; align-items: stretch; }
  .evalbar { width: 14px; border-radius: 7px; background: #2a2520; position: relative; overflow: hidden; border: 1px solid var(--line-2); }
  .evalbar i { position: absolute; left: 0; right: 0; bottom: 0; background: #f4efe6; transition: height .4s ease; }
  .board { --s: min(calc((100cqh - 32px) / 8), calc((100cqw - 54px) / 8), 84px); display: grid; grid-template-columns: repeat(8, var(--s)); grid-template-rows: repeat(8, var(--s)); border: 3px solid #5b4630; border-radius: 4px; position: relative; user-select: none; touch-action: none; box-shadow: var(--shadow); }
  .sq { position: relative; display: grid; place-items: center; }
  .sq.l { background: #eadbc0; } .sq.d { background: #a9825a; }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: rgba(214, 170, 60, .42); }
  .sq.sel::before { content: ""; position: absolute; inset: 0; background: rgba(80, 140, 90, .5); }
  .sq.chk { background: radial-gradient(circle, #e8553e 0%, #c9422c 45%, transparent 75%), var(--bgc); }
  .sq.l.chk { --bgc: #eadbc0; } .sq.d.chk { --bgc: #a9825a; }
  .sq .dot { position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(40, 60, 40, .32); z-index: 2; pointer-events: none; }
  .sq .ring { position: absolute; inset: 4%; border-radius: 50%; border: calc(var(--s) * .07) solid rgba(40, 60, 40, .32); z-index: 2; pointer-events: none; }
  .co { position: absolute; font: 700 calc(var(--s) * .16)/1 var(--font); pointer-events: none; } .co.r { left: 3px; top: 3px; } .co.f { right: 4px; bottom: 2px; }
  .sq.l .co { color: #a9825a; } .sq.d .co { color: #eadbc0; }
  .pc { width: 88%; height: 88%; position: relative; z-index: 3; cursor: grab; pointer-events: none; }
  .pc.mine { pointer-events: auto; }
  .ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -50%); }
  svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
  .side { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .sect { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .status { font-weight: 600; font-size: 14.5px; } .status small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
  .players { display: grid; gap: 4px; font-size: 13px; } .players div { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; border-radius: 6px; } .players .on { background: var(--panel-2); font-weight: 600; }
  .cap { font-size: 16px; letter-spacing: -2px; min-height: 20px; color: var(--ink-2); } .cap span { font-size: 11px; letter-spacing: 0; color: var(--ink-3); margin-left: 6px; }
  .moves { flex: 1; overflow: auto; padding: 8px 14px; display: grid; grid-template-columns: 34px 1fr 1fr; gap: 2px 6px; align-content: start; font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .moves .n { color: var(--ink-3); } .moves .m { padding: 1px 6px; border-radius: 5px; cursor: pointer; } .moves .m:hover { background: var(--panel-2); } .moves .m.cur { background: color-mix(in srgb, var(--accent) 16%, transparent); font-weight: 600; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .btns .ap-btn { justify-content: center; padding: 0 6px; }
  @media (max-width: 760px) { .body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 260px; } .side { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="ap">
  <div class="ap-bar"><h1>Ajedrez</h1>
    <select class="ap-in" id="lvl" title="Contra quién juegas">
      <option value="0">Principiante</option><option value="1">Aficionado</option><option value="2" selected>Fuerte</option><option value="3">Maestro</option><option value="9">Dos personas</option></select>
    <button class="ap-btn" id="nueva">Nueva partida</button><span class="sp"></span>
    <button class="ap-btn" id="fen" title="Empezar desde una posición (FEN)">Posición…</button><button class="ap-btn" id="pgn" title="Guardar la partida en PGN">Guardar PGN</button></div>
  <div class="body">
    <div class="stage"><div class="wrap"><div class="evalbar" id="eb" title="Quién va ganando"><i id="ebi" style="height:50%"></i></div><div class="board" id="board"></div></div></div>
    <div class="side">
      <div class="sect"><div class="status" id="status"></div><div class="players" id="players"></div></div>
      <div class="sect"><div class="cap" id="capB"></div><div class="cap" id="capW"></div></div>
      <div class="moves" id="moves"></div>
      <div class="sect"><div class="btns"><button class="ap-btn" id="undo" title="Deshacer tu última jugada">Deshacer</button><button class="ap-btn" id="hint" title="Qué jugaría el motor">Pista</button><button class="ap-btn" id="flip" title="Girar el tablero">Girar</button></div>
        <div class="btns" style="grid-template-columns:1fr 1fr"><button class="ap-btn" id="swap" title="Cambiar de color">Cambiar color</button><button class="ap-btn" id="resign">Rendirse</button></div></div>
    </div>
  </div>
</div>
<script src="/sdk/sotos-sdk.js"></script>
<script src="../comun/apps.js"></script>
<script src="motor.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
/* piezas dibujadas (trazo propio, sin fuentes): rey, dama, torre, alfil, caballo, peón */
const SHAPES = {
  k: '<path d="M22.5 6v6M19.5 9h6"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M12.5 37c5.5 3.5 14.5 3.5 20 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-2.5-7.5-12-10.5-16-4-3 6 6 10.5 6 10.5v7"/><path d="M12.5 30c5.5-3 14.5-3 20 0M12.5 33.5c5.5-3 14.5-3 20 0M12.5 37c5.5-3 14.5-3 20 0" class="ln"/>',
  q: '<path d="M9 26c8.5-1.5 21-1.5 27 0l2.5-12.5L31 25l-.3-14.1-5.2 13.6-3-14.5-3 14.5-5.2-13.6L14 25 6.5 13.5 9 26z"/><path d="M9 26c0 2 1.5 2 2.5 4 1 1.5 1 1 .5 3.5-1.5 1-1.5 2.5-1.5 2.5-1.5 1.5.5 2.5.5 2.5 6.5 1 16.5 1 23 0 0 0 1.5-1 0-2.5 0 0 .5-1.5-1-2.5-.5-2.5-.5-2 .5-3.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0" class="ln"/><circle cx="6" cy="12" r="2"/><circle cx="14" cy="9" r="2"/><circle cx="22.5" cy="8" r="2"/><circle cx="31" cy="9" r="2"/><circle cx="39" cy="12" r="2"/>',
  r: '<path d="M9 39h27v-3H9v3zM12.5 32l1.5-2.5h17l1.5 2.5h-20zM12 36v-4h21v4H12z"/><path d="M14 29.5v-13h17v13H14z"/><path d="M14 16.5L11 14h23l-3 2.5H14zM11 14V9h4v2h5V9h5v2h5V9h4v5H11z"/><path d="M12 35.5h21M13 31.5h19M14 29.5h17M14 16.5h17M11 14h23" class="ln"/>',
  b: '<path d="M9 36c3.4-1 10.1.4 13.5-2 3.4 2.4 10.1 1 13.5 2 0 0 1.6.5 3 2-.7 1-1.6 1-3 .5-3.4-1-10.1.5-13.5-1-3.4 1.5-10.1 0-13.5 1-1.4.5-2.3.5-3-.5 1.4-1.9 3-2 3-2z"/><path d="M15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2z"/><circle cx="22.5" cy="8" r="2.5"/><path d="M17.5 26h10M15 30h15M22.5 15.5v5M20 18h5" class="ln"/>',
  n: '<path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/><path d="M24 18c.4 2.9-5.6 7.4-8 9-3 2-2.8 4.3-5 4-1-.9 1.4-3 0-3-1 0 .2 1.2-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.9-1.9 2-3.5c-.7-1-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.8-2 2.5-3c1 0 1 3 1 3"/><circle cx="12" cy="25.5" r=".6" class="ln"/><path d="M14.9 15.8c-.3.8-.8 1.4-1.2 1.3" class="ln"/>',
  p: '<path d="M22.5 9c-2.2 0-4 1.8-4 4 0 .9.3 1.7.8 2.4-2 1.1-3.3 3.2-3.3 5.6 0 2 .9 3.8 2.4 5-3 1.1-7.4 5.6-7.4 13.5h23c0-7.9-4.4-12.4-7.4-13.5 1.5-1.2 2.4-3 2.4-5 0-2.4-1.3-4.5-3.3-5.6.5-.7.8-1.5.8-2.4 0-2.2-1.8-4-4-4z"/>',
};
const pieceSvg = (p) => { const w = p < "a"; return `<svg class="pc" viewBox="0 0 45 45"><g fill="${w ? "#fbf8f2" : "#2a2520"}" stroke="${w ? "#2a2520" : "#0f0d0b"}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">${SHAPES[p.toLowerCase()].replace(/class="ln"/g, `fill="none" stroke="${w ? "#2a2520" : "#cfc4b2"}"`)}</g></svg>`; };
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const LEVELS = [{ depth: 1, spread: 160, noise: 80 }, { depth: 2, spread: 45, noise: 20 }, { time: 1200, noise: 12 }, { time: 3500 }];
const LNAME = ["Principiante", "Aficionado", "Fuerte", "Maestro"];
/* primeras jugadas con variedad (el motor solo ya es correcto, pero repetiría siempre lo mismo) */
const BOOK = { "": ["e2e4", "d2d4", "c2c4", "g1f3"], "e2e4": ["e7e5", "c7c5", "e7e6", "c7c6"], "d2d4": ["d7d5", "g8f6"], "c2c4": ["e7e5", "g8f6", "c7c5"], "g1f3": ["d7d5", "g8f6"],
  "e2e4 e7e5": ["g1f3"], "e2e4 c7c5": ["g1f3", "b1c3"], "e2e4 e7e6": ["d2d4"], "e2e4 c7c6": ["d2d4"], "d2d4 d7d5": ["c2c4", "g1f3"], "d2d4 g8f6": ["c2c4", "g1f3"], "e2e4 e7e5 g1f3": ["b8c6", "g8f6"], "e2e4 e7e5 g1f3 b8c6": ["f1b5", "f1c4", "d2d4"],
  "e2e4 c7c5 g1f3": ["d7d6", "b8c6", "e7e6"], "e2e4 c7c5 b1c3": ["b8c6", "e7e6"], "e2e4 e7e6 d2d4": ["d7d5"], "e2e4 c7c6 d2d4": ["d7d5"], "e2e4 e7e5 f1c4": ["g8f6", "b8c6"], "e2e4 e7e5 b1c3": ["g8f6", "b8c6"], "e2e4 e7e5 d2d4": ["e5d4"],
  "d2d4 d7d5 c2c4": ["e7e6", "c7c6", "d5c4"], "d2d4 g8f6 c2c4": ["e7e6", "g7g6"], "d2d4 d7d5 g1f3": ["g8f6"], "d2d4 g8f6 g1f3": ["d7d5", "e7e6"], "c2c4 e7e5": ["b1c3"], "g1f3 d7d5": ["d2d4", "g2g3"], "e2e4 d7d5": ["e4d5"], "d2d4 e7e6": ["c2c4", "e2e4"] };

let ch = new Chess(), startFen = Chess.START, line = [], human = "w", level = 2, flipped = false, sel = null, targets = [], thinking = false, arrows = [], lastEval = 0, over = null, resigned = null;
const sqName = Chess.sqName;
function boardSquares() { const o = []; for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) o.push(flipped ? (7 - r) * 16 + (7 - f) : r * 16 + f); return o; }
function render() {
  const st = ch.status(), last = ch.hist[ch.hist.length - 1]?.m, kingSq = st.check || (st.over && st.why === "mate") ? (ch.turn === "w" ? ch.kw : ch.kb) : -1, myTurn = canMove();
  $("#board").innerHTML = boardSquares().map((s, i) => { const r = s >> 4, f = s & 7, p = ch.b[s], light = (r + f) % 2 === 0, t = targets.find(m => m.t === s);
    return `<div class="sq ${light ? "l" : "d"}${last && (last.f === s || last.t === s) ? " last" : ""}${sel === s ? " sel" : ""}${s === kingSq ? " chk" : ""}" data-s="${s}">${i % 8 === 0 ? `<span class="co r">${8 - r}</span>` : ""}${i >= 56 ? `<span class="co f">${"abcdefgh"[f]}</span>` : ""}${p ? pieceSvg(p).replace('class="pc"', `class="pc${myTurn && (p < "a") === (ch.turn === "w") ? " mine" : ""}"`) : ""}${t ? (p ? '<i class="ring"></i>' : '<i class="dot"></i>') : ""}</div>`; }).join("") + arrowSvg();
  // estado
  over = st.over ? st : resigned;
  const who = (c) => c === "w" ? "las blancas" : "las negras";
  $("#status").innerHTML = over ? (over.why === "mate" ? `Jaque mate: ganan ${who(ch.turn === "w" ? "b" : "w")}` : over.why === "rendicion" ? `Te rendiste: ganan ${who(human === "w" ? "b" : "w")}` : `Tablas${{ ahogado: " por ahogado", repeticion: " por repetición", cincuenta: " por la regla de 50 jugadas", material: ": no queda material para dar mate" }[over.why] || ""}`) + `<small>${over.result}</small>`
    : thinking ? `Sotos está pensando…<small>${LNAME[level] || ""}</small>` : `Juegan ${who(ch.turn)}${st.check ? " · ¡jaque!" : ""}<small>${level === 9 ? "Dos personas en el mismo equipo" : ch.turn === human ? "Tu turno: arrastra o toca una pieza" : ""}</small>`;
  const name = (c) => level === 9 ? (c === "w" ? "Blancas" : "Negras") : c === human ? "Tú" : `Sotos · ${LNAME[level]}`;
  $("#players").innerHTML = ["b", "w"].map(c => `<div class="${ch.turn === c && !over ? "on" : ""}"><span>${c === "w" ? "♔" : "♚"} ${name(c)}</span></div>`).join("");
  // capturas y ventaja de material
  const count = { w: {}, b: {} }; ch.b.forEach(p => { if (p) { const c = p < "a" ? "w" : "b"; count[c][p.toLowerCase()] = (count[c][p.toLowerCase()] || 0) + 1; } });
  const full = { q: 1, r: 2, b: 2, n: 2, p: 8 }, V = { q: 9, r: 5, b: 3, n: 3, p: 1 }; let mat = 0;
  const lost = (c) => Object.keys(full).map(t => GLYPH[t].repeat(Math.max(0, full[t] - (count[c][t] || 0)))).join("");
  Object.keys(V).forEach(t => mat += ((count.w[t] || 0) - (count.b[t] || 0)) * V[t]);
  $("#capW").innerHTML = `${lost("b")}${mat > 0 ? `<span>+${mat}</span>` : ""}`; $("#capB").innerHTML = `<span style="color:var(--ink)">${lost("w")}</span>${mat < 0 ? `<span>+${-mat}</span>` : ""}`;
  // jugadas
  const sans = sanLine(); let h = ""; for (let i = 0; i < sans.length; i += 2) h += `<span class="n">${Math.floor(i / 2) + 1}.</span><span class="m${i === sans.length - 1 ? " cur" : ""}">${sans[i]}</span><span class="m${i + 1 === sans.length - 1 ? " cur" : ""}">${sans[i + 1] || ""}</span>`;
  $("#moves").innerHTML = h || '<span class="ap-faint" style="grid-column:1/-1">Las jugadas aparecen aquí.</span>'; $("#moves").scrollTop = 1e6;
  const pct = 50 + 50 * Math.tanh(lastEval / 600); $("#ebi").style.height = (flipped ? 100 - pct : pct) + "%"; $("#eb").style.transform = flipped ? "scaleY(-1)" : "";
  $("#undo").disabled = !line.length || thinking; $("#hint").disabled = !!over || thinking || !myTurn; $("#resign").disabled = !!over || level === 9 || !line.length;
}
function sanLine(lang = "es") { const c = new Chess(startFen), out = []; for (const u of line) { const m = c.find(u); if (!m) break; out.push(c.san(m, lang)); c.play(m); } return out; }
function arrowSvg() {
  if (!arrows.length) return ""; const pos = (s) => { let r = s >> 4, f = s & 7; if (flipped) { r = 7 - r; f = 7 - f; } return [f * 100 + 50, r * 100 + 50]; };
  return `<svg class="arrows" viewBox="0 0 800 800"><defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10z" fill="rgba(47,107,69,.85)"/></marker></defs>${arrows.map(([a, b]) => { const p = pos(a), q = pos(b); return `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0] - (q[0] - p[0]) * .18}" y2="${q[1] - (q[1] - p[1]) * .18}" stroke="rgba(47,107,69,.85)" stroke-width="18" stroke-linecap="round" marker-end="url(#ah)"/>`; }).join("")}</svg>`;
}
const canMove = () => !over && !thinking && (level === 9 || ch.turn === human);

async function tryMove(from, to) {
  let opts = ch.legal().filter(m => m.f === from && m.t === to); if (!opts.length) return false;
  let m = opts[0];
  if (opts.length > 1) { const r = await ap.ask({ title: "Coronar el peón", fields: [{ key: "p", label: "Convertir en", type: "select", value: "q", options: [["q", "Dama"], ["r", "Torre"], ["b", "Alfil"], ["n", "Caballo"]] }], ok: "Coronar" }); if (!r) return false; m = opts.find(o => o.pr === r.p); }
  play(m); return true;
}
function play(m) { line.push(ch.uci(m)); ch.play(m); sel = null; targets = []; arrows = []; sound(m); save(); render(); if (!ch.status().over && level !== 9 && ch.turn !== human) setTimeout(engineMove, 250); }
function engineMove() {
  if (over || level === 9 || ch.turn === human) return; thinking = true; render();
  setTimeout(() => {
    const book = startFen === Chess.START && level >= 1 ? BOOK[line.join(" ")] : null; let m = null;
    if (book) m = ch.find(book[Math.floor(Math.random() * book.length)]);
    if (!m) { const r = Chess.search(ch, LEVELS[level]); m = r.move; lastEval = (ch.turn === "w" ? 1 : -1) * (r.mate ? Math.sign(r.mate) * 3000 : r.score); }
    thinking = false; play(m);
  }, 30);
}
let audio; function sound(m) { try { audio = audio || new AudioContext(); const o = audio.createOscillator(), g = audio.createGain(); o.type = "triangle"; o.frequency.value = m.c ? 300 : 520; g.gain.setValueAtTime(.08, audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + .09); o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .1); } catch {} }
const save = () => ap.store.set("partida", { startFen, line, human, level, flipped });

/* tocar o arrastrar */
let drag = null;
$("#board").addEventListener("pointerdown", (e) => {
  const sq = e.target.closest(".sq"); if (!sq || !canMove()) return; const s = +sq.dataset.s, p = ch.b[s];
  if (sel != null && targets.some(m => m.t === s)) { tryMove(sel, s); return; }
  if (p && (p < "a") === (ch.turn === "w")) {
    sel = s; targets = ch.legal().filter(m => m.f === s); render();
    const svg = $(`[data-s="${s}"] .pc`), r = svg.getBoundingClientRect(); const g = svg.cloneNode(true); g.classList.add("ghost"); g.style.width = r.width + "px"; g.style.height = r.height + "px"; g.style.left = e.clientX + "px"; g.style.top = e.clientY + "px"; g.style.display = "none"; document.body.appendChild(g);
    drag = { s, g, x: e.clientX, y: e.clientY, moved: false }; $("#board").setPointerCapture(e.pointerId);
  } else { sel = null; targets = []; render(); }
});
$("#board").addEventListener("pointermove", (e) => { if (!drag) return; if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) { drag.moved = true; drag.g.style.display = ""; const o = $(`[data-s="${drag.s}"] .pc`); if (o) o.style.opacity = ".25"; } drag.g.style.left = e.clientX + "px"; drag.g.style.top = e.clientY + "px"; });
$("#board").addEventListener("pointerup", (e) => { if (!drag) return; const d = drag; drag = null; d.g.remove(); if (!d.moved) return; const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".sq"); const to = el ? +el.dataset.s : -1; tryMove(d.s, to).then(ok => { if (!ok) render(); }); });

function newGame(fen) { ch = new Chess(fen || Chess.START); startFen = fen || Chess.START; line = []; sel = null; targets = []; arrows = []; lastEval = 0; resigned = null; over = null; save(); render(); if (level !== 9 && ch.turn !== human) setTimeout(engineMove, 300); }
$("#nueva").onclick = () => newGame();
$("#lvl").onchange = (e) => { level = +e.target.value; save(); render(); if (level !== 9 && ch.turn !== human && !over) setTimeout(engineMove, 200); };
$("#undo").onclick = () => { if (thinking) return; resigned = null; const n = level === 9 ? 1 : (ch.turn === human ? 2 : 1); for (let i = 0; i < n && line.length; i++) { line.pop(); ch.undo(); } sel = null; targets = []; arrows = []; save(); render(); };
$("#flip").onclick = () => { flipped = !flipped; save(); render(); };
$("#swap").onclick = () => { if (level === 9) return; human = human === "w" ? "b" : "w"; flipped = human === "b"; save(); render(); if (!over && ch.turn !== human) setTimeout(engineMove, 200); };
$("#resign").onclick = async () => { if (await ap.confirm("¿Rendirte en esta partida?", { ok: "Rendirme" })) { resigned = { over: true, why: "rendicion", result: human === "w" ? "0-1" : "1-0" }; render(); } };
$("#hint").onclick = () => { $("#status").innerHTML = "Buscando una buena jugada…"; setTimeout(() => { const r = Chess.search(ch, { time: 1500 }); arrows = [[r.move.f, r.move.t]]; lastEval = (ch.turn === "w" ? 1 : -1) * r.score; render(); ap.toast(`Pista: ${ch.san(r.move, "es")}`); }, 30); };
$("#fen").onclick = async () => { const r = await ap.ask({ title: "Empezar desde una posición", text: "Pega una posición en notación FEN.", fields: [{ key: "f", label: "FEN", value: ch.fen() }], ok: "Empezar" }); if (!r) return; try { new Chess(r.f); newGame(r.f.trim()); } catch (e) { ap.toast(e.message); } };
$("#pgn").onclick = () => {
  const sans = sanLine("en"), d = new Date(), res = over ? over.result : "*", nm = (c) => level === 9 ? (c === "w" ? "Blancas" : "Negras") : c === human ? "Jugador" : `Sotos (${LNAME[level]})`;
  let body = ""; sans.forEach((s, i) => { body += (i % 2 === 0 ? `${i / 2 + 1}. ` : "") + s + " "; });
  const head = [["Event", "Partida en Sotos"], ["Site", "Sotos"], ["Date", `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`], ["White", nm("w")], ["Black", nm("b")], ["Result", res]].concat(startFen !== Chess.START ? [["SetUp", "1"], ["FEN", startFen]] : []);
  const txt = head.map(([k, v]) => `[${k} "${v}"]`).join("\n") + "\n\n" + (body + res).replace(/(.{1,78})(\s|$)/g, "$1\n");
  ap.save(`partida-${d.toISOString().slice(0, 10)}.pgn`, new Blob([txt], { type: "application/x-chess-pgn" }));
};
(async () => {
  await ap.ready; const s = await ap.store.get("partida");
  if (s && Array.isArray(s.line)) { try { startFen = s.startFen || Chess.START; ch = new Chess(startFen); for (const u of s.line) { const m = ch.find(u); if (!m) break; ch.play(m); line.push(u); } human = s.human || "w"; level = s.level ?? 2; flipped = !!s.flipped; } catch { ch = new Chess(); line = []; } }
  $("#lvl").value = String(level); render(); if (!ch.status().over && level !== 9 && ch.turn !== human) setTimeout(engineMove, 400);
})();
</script>
</body>
</html>
