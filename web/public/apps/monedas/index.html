<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monedas</title>
<!-- Sotos — Monedas (ExchangeRate-API y Frankfurter, por el permiso «net» del SDK) · © 2026 Sebastian Sotomontes -->
<link rel="stylesheet" href="../comun/apps.css">
<style>
  .wrap { max-width: 860px; margin: 0 auto; padding: 22px; display: grid; gap: 16px; }
  .conv { padding: 18px; display: grid; gap: 14px; }
  .line { display: grid; grid-template-columns: 1fr 200px; gap: 10px; }
  .line .ap-in { height: 46px; font-size: 22px; font-weight: 700; } .line select.ap-in { font-size: 14px; font-weight: 600; }
  .swap { justify-self: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-size: 18px; }
  .rate { color: var(--ink-2); font-size: 13px; } .rate b { color: var(--ink); }
  .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .quick div { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
  .quick div:hover { border-color: var(--accent); } .quick b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; } .quick span { font-size: 12px; color: var(--ink-3); }
  .hist { padding: 14px 16px; } .hist h3 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  svg text { font: 11px var(--font); fill: var(--ink-3); }
  .src { font-size: 11.5px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="ap">
  <div class="ap-bar"><h1>Monedas</h1><span class="sp"></span><span class="ap-faint" id="upd"></span><button class="ap-btn" id="ref">Actualizar</button></div>
  <div class="ap-main"><div class="wrap">
    <div class="ap-card conv">
      <div class="line"><input class="ap-in" id="amt" inputmode="decimal" value="100"><select class="ap-in" id="from"></select></div>
      <button class="swap" id="swap" title="Intercambiar">&#8645;</button>
      <div class="line"><input class="ap-in" id="res" readonly><select class="ap-in" id="to"></select></div>
      <div class="rate" id="rate"></div>
    </div>
    <div><div class="ap-faint" style="margin-bottom:8px">Lo mismo en otras monedas · toca una para convertir a ella</div><div class="quick" id="quick"></div></div>
    <div class="ap-card hist"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3 id="htitle">Historial</h3>
      <div class="ap-seg" id="span"><button data-d="30">1 mes</button><button data-d="90" class="on">3 meses</button><button data-d="365">1 año</button></div></div><div id="chart"></div></div>
    <div class="src">Tasas del día: ExchangeRate-API (open.er-api.com). Historial: Frankfurter (Banco Central Europeo), solo para las monedas que publica el BCE. Sotos hace las consultas por la app, solo a estos dos sitios.</div>
  </div></div>
</div>
<script src="/sdk/sotos-sdk.js"></script>
<script src="../comun/apps.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const names = new Intl.DisplayNames(["es"], { type: "currency" });
const name = (c) => { try { return names.of(c); } catch { return c; } };
let S = { from: "USD", to: "COP", amt: 100, days: 90 }, rates = null, ecb = null;
const QUICK = ["USD", "EUR", "COP", "MXN", "ARS", "BRL", "CLP", "PEN", "GBP", "JPY", "CAD", "CHF"];
const money = (v, c) => { try { return new Intl.NumberFormat("es", { style: "currency", currency: c, maximumFractionDigits: v >= 1000 ? 0 : v >= 1 ? 2 : 4 }).format(v); } catch { return v.toFixed(2) + " " + c; } };
async function get(url) { const r = await sotos.net.fetch(url); if (!r.ok) throw new Error("El servicio respondió " + r.status); return r.json(); }
async function loadRates() {
  try { const j = await get("https://open.er-api.com/v6/latest/USD"); if (j.result !== "success") throw new Error("Respuesta no válida"); rates = j.rates; $("#upd").textContent = "Tasas del " + new Date(j.time_last_update_unix * 1000).toLocaleDateString("es", { dateStyle: "medium" });
    const opts = Object.keys(rates).sort((a, b) => name(a).localeCompare(name(b), "es")).map(c => `<option value="${c}">${c} · ${ap.esc(name(c))}</option>`).join(""); $("#from").innerHTML = opts; $("#to").innerHTML = opts; $("#from").value = S.from; $("#to").value = S.to; calc(); history(); }
  catch (e) { $("#rate").innerHTML = `<span style="color:var(--bad)">No se pudieron traer las tasas: ${ap.esc(e.message)}</span>`; }
}
const conv = (v, a, b) => v / rates[a] * rates[b];
function calc() {
  if (!rates) return; const v = parseFloat(String($("#amt").value).replace(/\./g, "").replace(",", ".")) || 0; S.amt = v; S.from = $("#from").value; S.to = $("#to").value; ap.store.set("prefs", S);
  $("#res").value = money(conv(v, S.from, S.to), S.to);
  $("#rate").innerHTML = `1 ${S.from} = <b>${money(conv(1, S.from, S.to), S.to)}</b> · 1 ${S.to} = <b>${money(conv(1, S.to, S.from), S.from)}</b>`;
  $("#quick").innerHTML = QUICK.filter(c => c !== S.from && rates[c]).map(c => `<div data-c="${c}"><b>${money(conv(v, S.from, c), c)}</b><span>${c} · ${ap.esc(name(c))}</span></div>`).join("");
}
$("#quick").onclick = (e) => { const d = e.target.closest("[data-c]"); if (d) { $("#to").value = d.dataset.c; calc(); history(); } };
["amt"].forEach(id => $("#" + id).oninput = calc); $("#from").onchange = () => { calc(); history(); }; $("#to").onchange = () => { calc(); history(); };
$("#swap").onclick = () => { const a = $("#from").value; $("#from").value = $("#to").value; $("#to").value = a; calc(); history(); };
document.querySelectorAll("#span button").forEach(b => b.onclick = () => { S.days = +b.dataset.d; document.querySelectorAll("#span button").forEach(x => x.classList.toggle("on", x === b)); history(); });
async function history() {
  const { from, to, days } = S; $("#htitle").textContent = `${from} → ${to}`;
  try {
    if (!ecb) ecb = Object.keys(await get("https://api.frankfurter.dev/v1/currencies"));
    if (!ecb.includes(from) || !ecb.includes(to)) { $("#chart").innerHTML = `<p class="ap-muted" style="font-size:13px">El Banco Central Europeo no publica historial de ${[from, to].filter(c => !ecb.includes(c)).join(" ni ")}. Prueba con USD, EUR, MXN, BRL, GBP…</p>`; return; }
    const start = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10), j = await get(`https://api.frankfurter.dev/v1/${start}..?from=${from}&to=${to}`);
    const pts = Object.entries(j.rates).map(([d, r]) => ({ d, v: r[to] })); if (pts.length < 2) { $("#chart").innerHTML = '<p class="ap-muted">Sin datos.</p>'; return; }
    const lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v)), W = 800, H = 200, X = (k) => 40 + k * (W - 60) / (pts.length - 1), Y = (v) => 14 + (hi - v) / ((hi - lo) || 1) * (H - 44);
    const line = pts.map((p, k) => (k ? "L" : "M") + X(k).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" "), first = pts[0].v, last = pts[pts.length - 1].v, ch = (last - first) / first * 100;
    $("#chart").innerHTML = `<div style="font-size:13px;margin-bottom:6px">${days === 365 ? "En un año" : days === 90 ? "En tres meses" : "En un mes"}: <b style="color:${ch >= 0 ? "var(--ok)" : "var(--bad)"}">${ch >= 0 ? "+" : ""}${ch.toFixed(2)} %</b> · mínimo ${money(lo, to)} · máximo ${money(hi, to)}</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="height:${H}px" preserveAspectRatio="none"><path d="${line} L ${X(pts.length - 1)} ${H - 30} L ${X(0)} ${H - 30} Z" fill="color-mix(in srgb, var(--accent) 12%, transparent)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <text x="4" y="${Y(hi) + 4}">${hi.toPrecision(4)}</text><text x="4" y="${Y(lo) + 4}">${lo.toPrecision(4)}</text>
      ${[0, Math.floor(pts.length / 2), pts.length - 1].map(k => `<text x="${X(k)}" y="${H - 10}" text-anchor="middle">${new Date(pts[k].d + "T12:00").toLocaleDateString("es", { day: "numeric", month: "short" })}</text>`).join("")}</svg>`;
  } catch (e) { $("#chart").innerHTML = `<p style="color:var(--bad);font-size:13px">No se pudo traer el historial: ${ap.esc(e.message)}</p>`; }
}
$("#ref").onclick = loadRates;
(async () => { await ap.ready; S = { ...S, ...((await ap.store.get("prefs")) || {}) }; $("#amt").value = S.amt; document.querySelectorAll("#span button").forEach(x => x.classList.toggle("on", +x.dataset.d === S.days)); loadRates(); })();
</script>
</body>
</html>
