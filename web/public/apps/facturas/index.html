<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturas</title>
<!-- Sotos — Facturas: cotizaciones, cuentas de cobro y facturas con IVA, retenciones, abonos y PDF · © 2026 Sebastian Sotomontes -->
<link rel="stylesheet" href="../comun/apps.css">
<style>
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 190px minmax(0, 1fr); }
  .nav { border-right: 1px solid var(--line); background: var(--panel); padding: 10px; display: grid; gap: 2px; align-content: start; }
  .nav button { border: 0; background: none; text-align: left; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; }
  .nav button.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); } .nav button:hover { background: var(--panel-2); }
  .nav small { font-weight: 400; color: var(--ink-3); }
  .main { overflow: auto; padding: 18px 22px; display: grid; gap: 14px; align-content: start; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; } .kpi { padding: 12px 14px; } .kpi span { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; } .kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; } .kpi.warn b { color: var(--bad); }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line-2); background: var(--panel); border-radius: 16px; padding: 4px 11px; cursor: pointer; font-size: 12.5px; } .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  table.list { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  table.list th { text-align: left; font-size: 11.5px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line-2); }
  table.list td { padding: 9px 10px; border-bottom: 1px solid var(--line); } table.list tr.r { cursor: pointer; } table.list tr.r:hover td { background: var(--panel-2); }
  .n { text-align: right; } .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11.5px; font-weight: 600; background: var(--panel-2); color: var(--ink-2); }
  .b-pagada { background: #dcebd9; color: #2d5e2f; } .b-vencida { background: #f3d6d1; color: #8c2c22; } .b-pendiente { background: #f4e6c8; color: #7a5410; } .b-anulada { text-decoration: line-through; } .b-aceptada { background: #d6e4ee; color: #234d6b; }
  :root[data-sotos-theme="dark"] .b-pagada { background: #24402a; color: #a7d8a9; } :root[data-sotos-theme="dark"] .b-vencida { background: #4a2420; color: #f0a99f; } :root[data-sotos-theme="dark"] .b-pendiente { background: #4a3a18; color: #f0d08a; } :root[data-sotos-theme="dark"] .b-aceptada { background: #1f3445; color: #a9cbe6; }
  .ed { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; } .grid .w2 { grid-column: span 2; }
  .f { display: grid; gap: 4px; font-size: 12px; color: var(--ink-3); } .f .ap-in, .f textarea { width: 100%; color: var(--ink); }
  .items { width: 100%; border-collapse: collapse; font-size: 13px; } .items th { font-size: 11px; color: var(--ink-3); text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line-2); font-weight: 600; }
  .items td { padding: 4px; border-bottom: 1px solid var(--line); vertical-align: top; } .items .ap-in { width: 100%; height: 30px; padding: 0 7px; } .items td.tot { text-align: right; padding-top: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .items .x { border: 0; background: none; cursor: pointer; color: var(--ink-3); padding: 6px; } .items .x:hover { color: var(--bad); }
  .totals { padding: 14px 16px; display: grid; gap: 6px; font-size: 13.5px; position: sticky; top: 0; } .totals .kv { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; } .totals .kv span { color: var(--ink-3); }
  .totals .big { font-size: 19px; font-weight: 700; border-top: 1px solid var(--line-2); padding-top: 8px; margin-top: 4px; } .totals .big span { color: var(--ink); }
  .letras { font-size: 11.5px; color: var(--ink-3); font-style: italic; }
  .acts { display: grid; gap: 6px; } .acts .ap-btn { justify-content: center; }
  .card { padding: 14px 16px; display: grid; gap: 10px; } .card h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .pay { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .note { font-size: 12px; color: var(--ink-3); background: var(--panel-2); border-radius: 8px; padding: 9px 12px; }
  .logo { width: 120px; height: 60px; border: 1px dashed var(--line-2); border-radius: 8px; display: grid; place-items: center; cursor: pointer; overflow: hidden; background: #fff; } .logo img { max-width: 100%; max-height: 100%; }
  svg text { font: 11px var(--font); fill: var(--ink-3); }
  @media (max-width: 860px) { .body { grid-template-columns: 1fr; } .nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); } .ed { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="ap">
  <div class="ap-bar"><h1>Facturas</h1><span class="ap-faint" id="emp"></span><span class="sp"></span>
    <button class="ap-btn" data-new="F">Nueva factura</button><button class="ap-btn" data-new="C">Nueva cotización</button><button class="ap-btn" data-new="R">Nueva cuenta de cobro</button></div>
  <div class="body">
    <div class="nav" id="nav">
      <button data-v="docs" class="on">Documentos <small id="cDocs"></small></button><button data-v="clientes">Clientes <small id="cCli"></small></button>
      <button data-v="productos">Productos y servicios <small id="cProd"></small></button><button data-v="informe">Informe</button><button data-v="empresa">Mi empresa</button></div>
    <div class="main" id="main"></div>
  </div>
</div>
<script src="/sdk/sotos-sdk.js"></script>
<script src="../comun/apps.js"></script>
<script src="../comun/pdf.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const TIPOS = { F: "Factura de venta", C: "Cotización", R: "Cuenta de cobro" }, CORTO = { F: "Factura", C: "Cotización", R: "Cuenta de cobro" };
let D = { empresa: { nombre: "", nit: "", dir: "", ciudad: "", tel: "", correo: "", regimen: "Responsable de IVA", banco: "", nota: "", moneda: "COP", logo: null, validez: 15, plazo: 30 },
  clientes: [], productos: [], docs: [], seq: { F: 1, C: 1, R: 1 }, pref: { F: "FV-", C: "COT-", R: "CC-" } };
let view = "docs", filtro = { tipo: "", estado: "", q: "" }, editing = null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hoy = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d + "T12:00"); x.setDate(x.getDate() + Number(n || 0)); return x.toISOString().slice(0, 10); };
const money = (v) => new Intl.NumberFormat("es-CO", { style: "currency", currency: D.empresa.moneda || "COP", maximumFractionDigits: D.empresa.moneda === "COP" ? 0 : 2 }).format(v || 0);
const fdate = (d) => d ? new Date(d + "T12:00").toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" }) : "";
const save = () => ap.store.set("facturas", D);

/* ---------- cálculos ---------- */
function calc(doc) {
  let bruto = 0, desc = 0, iva = 0, porIva = {};
  doc.items.forEach(it => { const q = +it.q || 0, p = +it.p || 0, b = q * p, d = b * (+it.desc || 0) / 100, base = b - d, v = base * (+it.iva || 0) / 100; bruto += b; desc += d; iva += v; const k = +it.iva || 0; porIva[k] = (porIva[k] || 0) + base; });
  const base = bruto - desc, r = doc.ret || {}, rf = base * (+r.fuente || 0) / 100, ri = r.iva ? iva * 0.15 : 0, rc = base * (+r.ica || 0) / 1000;
  const R = (x) => D.empresa.moneda === "COP" ? Math.round(x) : Math.round(x * 100) / 100;
  const total = R(base + iva), ret = R(rf) + R(ri) + R(rc), neto = total - ret, pagado = (doc.pagos || []).reduce((s, p) => s + (+p.valor || 0), 0);
  return { bruto: R(bruto), desc: R(desc), base: R(base), iva: R(iva), porIva, rf: R(rf), ri: R(ri), rc: R(rc), total, ret, neto, pagado, saldo: R(neto - pagado) };
}
function estado(doc) {
  if (doc.anulada) return "anulada"; const c = calc(doc);
  if (doc.tipo === "C") return doc.convertida ? "aceptada" : doc.vence && doc.vence < hoy() ? "vencida" : "abierta";
  if (c.neto > 0 && c.saldo <= 0) return "pagada"; if (doc.vence && doc.vence < hoy()) return "vencida"; return "pendiente";
}
const ENAME = { pagada: "Pagada", vencida: "Vencida", pendiente: "Por cobrar", anulada: "Anulada", abierta: "Abierta", aceptada: "Aceptada" };
const cliente = (id) => D.clientes.find(c => c.id === id);

/* ---------- vistas ---------- */
function nav() { document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view)); $("#cDocs").textContent = D.docs.length || ""; $("#cCli").textContent = D.clientes.length || ""; $("#cProd").textContent = D.productos.length || ""; $("#emp").textContent = D.empresa.nombre ? `${D.empresa.nombre}${D.empresa.nit ? " · NIT " + D.empresa.nit : ""}` : ""; }
function show(v) { view = v; editing = null; nav(); ({ docs: vDocs, clientes: vClientes, productos: vProductos, informe: vInforme, empresa: vEmpresa })[v](); }
function vDocs() {
  const vivos = D.docs.filter(d => !d.anulada && d.tipo !== "C"), mes = hoy().slice(0, 7);
  const porCobrar = vivos.reduce((s, d) => s + Math.max(0, calc(d).saldo), 0), vencido = vivos.filter(d => estado(d) === "vencida").reduce((s, d) => s + calc(d).saldo, 0);
  const cobrado = D.docs.flatMap(d => d.anulada ? [] : (d.pagos || [])).filter(p => (p.fecha || "").startsWith(mes)).reduce((s, p) => s + (+p.valor || 0), 0), abiertas = D.docs.filter(d => d.tipo === "C" && estado(d) === "abierta");
  let list = D.docs.slice().sort((a, b) => (b.fecha + b.num).localeCompare(a.fecha + a.num));
  if (filtro.tipo) list = list.filter(d => d.tipo === filtro.tipo); if (filtro.estado) list = list.filter(d => estado(d) === filtro.estado);
  if (filtro.q) { const q = filtro.q.toLowerCase(); list = list.filter(d => (d.num + " " + (d.cli?.nombre || "") + " " + d.items.map(i => i.d).join(" ")).toLowerCase().includes(q)); }
  const chips = (k, opts) => opts.map(([v, t]) => `<button class="chip ${filtro[k] === v ? "on" : ""}" data-f="${k}" data-v="${v}">${t}</button>`).join("");
  $("#main").innerHTML = `<div class="kpis"><div class="ap-card kpi"><span>Por cobrar</span><b>${money(porCobrar)}</b></div><div class="ap-card kpi ${vencido > 0 ? "warn" : ""}"><span>Vencido</span><b>${money(vencido)}</b></div><div class="ap-card kpi"><span>Cobrado este mes</span><b>${money(cobrado)}</b></div><div class="ap-card kpi"><span>Cotizaciones abiertas</span><b>${abiertas.length} · ${money(abiertas.reduce((s, d) => s + calc(d).total, 0))}</b></div></div>
    <div class="tools">${chips("tipo", [["", "Todos"], ["F", "Facturas"], ["C", "Cotizaciones"], ["R", "Cuentas de cobro"]])}<span style="width:10px"></span>${chips("estado", [["", "Cualquier estado"], ["pendiente", "Por cobrar"], ["vencida", "Vencidas"], ["pagada", "Pagadas"]])}<span class="sp" style="flex:1"></span>
      <input class="ap-in" id="q" placeholder="Buscar número, cliente o concepto…" style="width:240px" value="${ap.esc(filtro.q)}"><button class="ap-btn" id="csv">Exportar para el contador</button></div>
    ${list.length ? `<table class="list"><thead><tr><th>Número</th><th>Cliente</th><th>Fecha</th><th>Vence</th><th class="n">Total</th><th class="n">Saldo</th><th>Estado</th></tr></thead><tbody>${list.map(d => { const c = calc(d), e = estado(d);
      return `<tr class="r" data-id="${d.id}"><td><b>${ap.esc(d.num)}</b><br><span class="ap-faint" style="font-size:11.5px">${CORTO[d.tipo]}</span></td><td>${ap.esc(d.cli?.nombre || "—")}</td><td>${fdate(d.fecha)}</td><td>${fdate(d.vence)}</td><td class="n">${money(c.neto)}</td><td class="n">${d.tipo === "C" ? "" : money(c.saldo)}</td><td><span class="badge b-${e}">${ENAME[e]}</span></td></tr>`; }).join("")}</tbody></table>`
      : `<div class="ap-empty"><div><b>${D.docs.length ? "Nada con estos filtros" : "Aún no hay documentos"}</b><p class="ap-muted">${D.docs.length ? "" : "Empieza por «Mi empresa» para que tus datos salgan en el PDF, y luego crea una cotización o una factura."}</p></div></div>`}
    <div class="note">Para la facturación electrónica ante la DIAN necesitas un proveedor tecnológico autorizado. Aquí llevas cotizaciones, cuentas de cobro y facturas para control interno y para enviar a tus clientes en PDF.</div>`;
  $("#main").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filtro[b.dataset.f] = b.dataset.v; vDocs(); });
  $("#main").querySelectorAll("tr.r").forEach(tr => tr.onclick = () => edit(D.docs.find(d => d.id === tr.dataset.id)));
  let t; $("#q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { filtro.q = e.target.value; vDocs(); const q = $("#q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); };
  $("#csv").onclick = exportCsv;
}
function nuevo(tipo, base) {
  const d = { id: uid(), tipo, num: D.pref[tipo] + String(D.seq[tipo]).padStart(4, "0"), fecha: hoy(), vence: addDays(hoy(), tipo === "C" ? D.empresa.validez : D.empresa.plazo), cliId: "", cli: null, items: [{ d: "", q: 1, p: 0, desc: 0, iva: tipo === "R" ? 0 : 19 }], ret: { fuente: 0, iva: false, ica: 0 }, notas: "", pagos: [], nuevo: true };
  if (base) Object.assign(d, { cliId: base.cliId, cli: base.cli, items: JSON.parse(JSON.stringify(base.items)), ret: { ...base.ret }, notas: base.notas, origen: base.num });
  edit(d);
}
function edit(doc) {
  editing = JSON.parse(JSON.stringify(doc)); const d = editing, e = estado(d);
  $("#main").innerHTML = `<div class="tools"><button class="ap-btn ghost" id="back">← Documentos</button><h2 style="margin:0;font-size:18px">${TIPOS[d.tipo]} ${ap.esc(d.num)}</h2>${d.nuevo ? "" : `<span class="badge b-${e}">${ENAME[e]}</span>`}${d.origen ? `<span class="ap-faint">desde ${ap.esc(d.origen)}</span>` : ""}</div>
    <div class="ed"><div style="display:grid;gap:14px">
      <div class="ap-card card"><div class="grid">
        <label class="f w2">Cliente<select class="ap-in" id="cli"><option value="">Elige un cliente…</option>${D.clientes.map(c => `<option value="${c.id}" ${c.id === d.cliId ? "selected" : ""}>${ap.esc(c.nombre)}</option>`).join("")}<option value="+">+ Cliente nuevo…</option></select></label>
        <label class="f">Número<input class="ap-in" id="num" value="${ap.esc(d.num)}"></label><label class="f">Fecha<input class="ap-in" type="date" id="fecha" value="${d.fecha}"></label>
        <label class="f">${d.tipo === "C" ? "Válida hasta" : "Vence"}<input class="ap-in" type="date" id="vence" value="${d.vence}"></label></div></div>
      <div class="ap-card card"><table class="items"><thead><tr><th style="width:44%">Descripción</th><th>Cant.</th><th>Precio</th><th>Desc. %</th><th>IVA</th><th style="text-align:right">Total</th><th></th></tr></thead><tbody id="items"></tbody></table>
        <datalist id="prods">${D.productos.map(p => `<option value="${ap.esc(p.nombre)}">`).join("")}</datalist>
        <div class="tools"><button class="ap-btn" id="addIt">+ Agregar línea</button>${D.productos.length ? '<span class="ap-faint" style="font-size:12px">Escribe y elige de tu catálogo para llenar precio e IVA.</span>' : ""}</div></div>
      <div class="ap-card card"><h3>Retenciones que te practica el cliente</h3><div class="grid">
        <label class="f">Retención en la fuente<select class="ap-in" id="rf">${[[0, "No aplica"], [2.5, "2,5 % compras"], [4, "4 % servicios"], [6, "6 % arrendamientos"], [10, "10 % honorarios"], [11, "11 % honorarios y consultoría"]].map(([v, t]) => `<option value="${v}" ${+d.ret.fuente === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <label class="f">ReteIVA (15 % del IVA)<select class="ap-in" id="ri"><option value="0">No aplica</option><option value="1" ${d.ret.iva ? "selected" : ""}>Sí</option></select></label>
        <label class="f">ReteICA (por mil)<input class="ap-in" type="number" step="0.01" min="0" id="rc" value="${d.ret.ica || 0}"></label></div></div>
      <div class="ap-card card"><label class="f">Notas y condiciones (salen en el PDF)<textarea class="ap-in" id="notas" rows="3" style="height:auto;padding:8px 10px">${ap.esc(d.notas || "")}</textarea></label></div>
      ${!d.nuevo && d.tipo !== "C" ? `<div class="ap-card card"><h3>Pagos y abonos</h3><div id="pays"></div><div class="tools"><button class="ap-btn" id="pay">+ Registrar pago</button></div></div>` : ""}
    </div>
    <div style="display:grid;gap:12px;position:sticky;top:0"><div class="ap-card totals" id="tots"></div>
      <div class="acts"><button class="ap-btn primary" id="save">Guardar</button><button class="ap-btn" id="pdf">Guardar PDF</button>
        ${!d.nuevo ? `<button class="ap-btn" id="dup">Duplicar</button>` : ""}${!d.nuevo && d.tipo === "C" && !d.convertida ? `<button class="ap-btn" id="conv">Convertir en factura</button>` : ""}
        ${!d.nuevo && !d.anulada ? `<button class="ap-btn" id="anular">Anular</button>` : ""}${!d.nuevo && (d.anulada || d.tipo === "C") ? `<button class="ap-btn" id="del" style="color:var(--bad)">Eliminar</button>` : ""}</div></div></div>`;
  renderItems(); renderTotals(); renderPays();
  const bind = (id, k, f = (v) => v) => { $(id).oninput = (ev) => { d[k] = f(ev.target.value); renderTotals(); }; };
  bind("#num", "num"); bind("#fecha", "fecha"); bind("#vence", "vence"); bind("#notas", "notas");
  $("#rf").onchange = (ev) => { d.ret.fuente = +ev.target.value; renderTotals(); }; $("#ri").onchange = (ev) => { d.ret.iva = ev.target.value === "1"; renderTotals(); }; $("#rc").oninput = (ev) => { d.ret.ica = +ev.target.value; renderTotals(); };
  $("#cli").onchange = async (ev) => { if (ev.target.value === "+") { const c = await askCliente(); if (c) { D.clientes.push(c); save(); d.cliId = c.id; d.cli = { ...c }; } edit(d); return; } d.cliId = ev.target.value; d.cli = cliente(d.cliId) ? { ...cliente(d.cliId) } : null; };
  $("#addIt").onclick = () => { d.items.push({ d: "", q: 1, p: 0, desc: 0, iva: d.tipo === "R" ? 0 : 19 }); renderItems(); renderTotals(); $("#items").lastElementChild.querySelector("input").focus(); };
  $("#back").onclick = () => show("docs");
  $("#save").onclick = () => guardar(true);
  $("#pdf").onclick = async () => { if (!guardar(false)) return; await pdf(D.docs.find(x => x.id === d.id)); };
  if ($("#dup")) $("#dup").onclick = () => nuevo(d.tipo, d);
  if ($("#conv")) $("#conv").onclick = () => { const orig = D.docs.find(x => x.id === d.id); orig.convertida = true; save(); nuevo("F", orig); };
  if ($("#anular")) $("#anular").onclick = async () => { if (!(await ap.confirm(`¿Anular ${d.num}? Queda en la lista como anulada y no cuenta en los totales.`, { ok: "Anular" }))) return; d.anulada = true; guardar(false); edit(d); };
  if ($("#del")) $("#del").onclick = async () => { if (!(await ap.confirm(`¿Eliminar ${d.num} para siempre?`, { ok: "Eliminar" }))) return; D.docs = D.docs.filter(x => x.id !== d.id); save(); show("docs"); };
  if ($("#pay")) $("#pay").onclick = async () => { const c = calc(d); const r = await ap.ask({ title: "Registrar pago", fields: [{ key: "f", label: "Fecha", type: "date", value: hoy() }, { key: "v", label: "Valor", type: "number", value: Math.max(0, c.saldo), min: 0 }, { key: "m", label: "Medio", type: "select", value: "Transferencia", options: ["Transferencia", "Efectivo", "Consignación", "Tarjeta", "Nequi o Daviplata", "Cheque", "Otro"].map(x => [x, x]) }, { key: "n", label: "Referencia (opcional)" }], ok: "Registrar" });
    if (!r || !(+r.v > 0)) return; d.pagos.push({ fecha: r.f, valor: +r.v, medio: r.m, ref: r.n }); guardar(false); edit(d); ap.toast(calc(d).saldo <= 0 ? "Pagada por completo" : `Abono registrado. Saldo: ${money(calc(d).saldo)}`); };
}
function renderItems() {
  const d = editing; $("#items").innerHTML = d.items.map((it, i) => `<tr data-i="${i}"><td><input class="ap-in" data-k="d" list="prods" value="${ap.esc(it.d)}" placeholder="Producto o servicio"></td><td><input class="ap-in" data-k="q" type="number" min="0" step="any" value="${it.q}" style="width:64px"></td>
    <td><input class="ap-in" data-k="p" type="number" min="0" step="any" value="${it.p}" style="width:110px"></td><td><input class="ap-in" data-k="desc" type="number" min="0" max="100" step="any" value="${it.desc || 0}" style="width:60px"></td>

      <div class="grid">${f("nombre", "Nombre o razón social", "w2")}${f("nit", "NIT")}<label class="f">Régimen<select class="ap-in" data-e="regimen">${["Responsable de IVA", "No responsable de IVA", "Régimen simple de tributación", "Gran contribuyente", "Persona natural"].map(x => `<option ${E.regimen === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
        ${f("dir", "Dirección", "w2")}${f("ciudad", "Ciudad")}${f("tel", "Teléfono")}${f("correo", "Correo", "w2")}
        <label class="f">Moneda<select class="ap-in" data-e="moneda">${[["COP", "Pesos colombianos"], ["USD", "Dólares"], ["EUR", "Euros"]].map(([v, t]) => `<option value="${v}" ${E.moneda === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <label class="f">Plazo de pago (días)<input class="ap-in" type="number" min="0" data-e="plazo" value="${E.plazo}"></label></div>
      <div class="grid"><label class="f w2">Datos para el pago (cuenta, banco, llave)<textarea class="ap-in" data-e="banco" rows="3" style="height:auto;padding:8px 10px">${ap.esc(E.banco)}</textarea></label><label class="f w2">Pie de página (resolución, aviso legal)<textarea class="ap-in" data-e="nota" rows="3" style="height:auto;padding:8px 10px">${ap.esc(E.nota)}</textarea></label></div>
      <div class="grid">${["F", "C", "R"].map(t => `<label class="f">Prefijo de ${CORTO[t].toLowerCase()}<input class="ap-in" data-p="${t}" value="${ap.esc(D.pref[t])}"></label>`).join("")}<label class="f">Validez de cotizaciones (días)<input class="ap-in" type="number" min="1" data-e="validez" value="${E.validez}"></label></div>
      <div class="ap-faint" style="font-size:12px">Los cambios se guardan solos.</div></div>`;
  let t; const deb = () => { clearTimeout(t); t = setTimeout(() => { save(); nav(); }, 500); };
  $("#main").querySelectorAll("[data-e]").forEach(el => el.oninput = el.onchange = () => { E[el.dataset.e] = ["plazo", "validez"].includes(el.dataset.e) ? +el.value : el.value; deb(); });
  $("#main").querySelectorAll("[data-p]").forEach(el => el.oninput = () => { D.pref[el.dataset.p] = el.value; deb(); });
  $("#logo").onclick = async () => { try { const [f] = await sotos.files.pick({ title: "Logo", types: ["img"] }); if (!f) return; const j = await SotosPDF.jpeg(await sotos.files.read(f), 500); let s = ""; j.bytes.forEach(b => s += String.fromCharCode(b)); E.logo = { b64: btoa(s), w: j.w, h: j.h }; save(); vEmpresa(); } catch (e) { ap.toast(e.message); } };
  if ($("#nologo")) $("#nologo").onclick = () => { E.logo = null; save(); vEmpresa(); };
}

$("#nav").onclick = (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.v); };
document.querySelectorAll("[data-new]").forEach(b => b.onclick = () => { view = "docs"; nav(); nuevo(b.dataset.new); });
(async () => { await ap.ready; const s = await ap.store.get("facturas"); if (s && s.docs) D = Object.assign(D, s, { empresa: Object.assign(D.empresa, s.empresa || {}) });
  show("docs"); const v = D.docs.filter(d => estado(d) === "vencida" && d.tipo !== "C"); if (v.length) ap.toast(`Tienes ${v.length} ${v.length === 1 ? "factura vencida" : "facturas vencidas"} por cobrar`, 3500); })();
</script>
</body>
</html>
