<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enciclopedia</title>
<!-- Sotos — Enciclopedia (Wikipedia en español, por el permiso «net» del SDK) · © 2026 Sebastian Sotomontes -->
<link rel="stylesheet" href="../comun/apps.css">
<style>
  .home { max-width: 1000px; margin: 0 auto; padding: 20px 22px 40px; display: grid; gap: 18px; }
  .home h2 { font: 700 12px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
  .feat { display: grid; grid-template-columns: 220px 1fr; gap: 16px; padding: 16px; cursor: pointer; } .feat img { width: 100%; border-radius: 8px; aspect-ratio: 4/3; object-fit: cover; background: var(--panel-2); }
  .feat h3 { margin: 0 0 6px; font: 700 22px Georgia, serif; } .feat p { margin: 0; color: var(--ink-2); line-height: 1.55; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .cards div { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; display: grid; gap: 4px; } .cards div:hover { border-color: var(--accent); }
  .cards b { font-size: 14px; } .cards span { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .otd { display: grid; gap: 8px; } .otd div { display: grid; grid-template-columns: 54px 1fr; gap: 10px; font-size: 13.5px; line-height: 1.45; } .otd b { font: 700 15px var(--mono); color: var(--accent); }
  .otd a { cursor: pointer; color: var(--accent); }
  .art { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
  .toc { border-right: 1px solid var(--line); padding: 14px 10px; font-size: 13px; position: sticky; top: 0; align-self: start; max-height: calc(100vh - 60px); overflow: auto; }
  .toc a { display: block; padding: 4px 8px; border-radius: 6px; cursor: pointer; color: var(--ink-2); } .toc a:hover { background: var(--panel-2); color: var(--ink); }
  .content { padding: 20px 34px 60px; max-width: 820px; font: 17px/1.7 Georgia, "Times New Roman", serif; }
  .content h1 { font-size: 32px; line-height: 1.2; margin: 0 0 4px; } .content .desc { font: 14px var(--font); color: var(--ink-3); margin-bottom: 18px; }
  .content h2 { font-size: 23px; border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 1.6em; } .content h3 { font-size: 19px; }
  .content a { color: var(--accent); cursor: pointer; text-decoration: none; } .content a:hover { text-decoration: underline; }
  .content img { max-width: 100%; height: auto; } .content figure { margin: 1em 0; max-width: 100%; } .content figcaption { font: 13px var(--font); color: var(--ink-3); }
  .content table { border-collapse: collapse; font: 13.5px var(--font); max-width: 100%; display: block; overflow-x: auto; } .content td, .content th { border: 1px solid var(--line); padding: 4px 8px; }
  .content .infobox { float: right; margin: 0 0 1em 1.4em; max-width: 300px; font-size: 13px; background: var(--panel); }
  .content sup.reference, .content .mw-editsection, .content .navbox, .content .noprint, .content .mw-empty-elt { display: none; }
  .res { max-width: 820px; margin: 0 auto; padding: 18px 22px; display: grid; gap: 8px; } .res div { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
  .res b { display: block; } .res span { font-size: 13px; color: var(--ink-2); } .res .searchmatch { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .src { font-size: 11.5px; color: var(--ink-3); }
  @media (max-width: 800px) { .art { grid-template-columns: 1fr; } .toc { display: none; } .feat { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="ap">
  <div class="ap-bar"><button class="ap-btn ghost icon" id="back" title="Atrás" disabled>&#8592;</button><h1>Enciclopedia</h1>
    <input class="ap-in" id="q" placeholder="Buscar en Wikipedia" style="flex:1;max-width:380px"><span class="sp"></span>
    <button class="ap-btn" id="home">Portada</button><button class="ap-btn" id="favs">Favoritos</button><button class="ap-btn" id="star" hidden>☆ Guardar</button><button class="ap-btn" id="saveDoc" hidden>Guardar en mi Drive</button></div>
  <div class="ap-main" id="main"></div>
</div>
<script src="/sdk/sotos-sdk.js"></script>
<script src="../comun/apps.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s), W = "https://es.wikipedia.org";
let hist = [], favs = [], cur = null;
async function get(url, text) { const r = await sotos.net.fetch(url, { headers: { accept: text ? "text/html" : "application/json" } }); if (!r.ok) throw new Error(r.status === 404 ? "No existe esa página" : "Wikipedia respondió " + r.status); return text ? r.text() : r.json(); }
const enc = (t) => encodeURIComponent(t.replace(/ /g, "_"));
const go = (view, push = true) => { if (push && cur) hist.push(cur); cur = view; $("#back").disabled = !hist.length; render(view); };
$("#back").onclick = () => { const v = hist.pop(); if (v) { cur = v; $("#back").disabled = !hist.length; render(v); } };
function render(v) { $("#star").hidden = $("#saveDoc").hidden = v.kind !== "art"; $("#main").scrollTop = 0; ({ home, search, art, favs: showFavs })[v.kind](v); }
const loading = (t) => $("#main").innerHTML = `<div class="ap-empty">${t}</div>`;
async function home() {
  loading("Abriendo la portada…"); const d = new Date(), y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
  try {
    const [f, o] = await Promise.all([get(`https://api.wikimedia.org/feed/v1/wikipedia/es/featured/${y}/${m}/${dd}`).catch(() => ({})), get(`https://api.wikimedia.org/feed/v1/wikipedia/es/onthisday/selected/${m}/${dd}`).catch(() => ({}))]);
    const tfa = f.tfa, most = (f.mostread?.articles || []).slice(0, 9), sel = (o.selected || []).slice(0, 8);
    $("#main").innerHTML = `<div class="home">
      ${tfa ? `<div><h2>Artículo destacado</h2><div class="ap-card feat" data-t="${ap.esc(tfa.titles.canonical)}">${tfa.thumbnail ? `<img src="${ap.esc(tfa.thumbnail.source)}" alt="">` : "<div></div>"}<div><h3>${ap.esc(tfa.titles.normalized)}</h3><p>${ap.esc(tfa.extract)}</p></div></div></div>` : ""}
      ${most.length ? `<div><h2>Lo más leído ayer</h2><div class="cards">${most.map(a => `<div data-t="${ap.esc(a.titles.canonical)}"><b>${ap.esc(a.titles.normalized)}</b><span>${ap.esc(a.description || a.extract || "")}</span></div>`).join("")}</div></div>` : ""}
      ${sel.length ? `<div><h2>Un ${d.getDate()} de ${d.toLocaleDateString("es", { month: "long" })} como hoy</h2><div class="otd">${sel.map(e => `<div><b>${e.year}</b><span>${ap.esc(e.text)} ${(e.pages || []).slice(0, 2).map(p => `<a data-t="${ap.esc(p.titles.canonical)}">→ ${ap.esc(p.titles.normalized)}</a>`).join(" ")}</span></div>`).join("")}</div></div>` : ""}
      ${!tfa && !most.length && !sel.length ? '<div class="ap-empty">Wikipedia no respondió. Prueba buscar algo arriba.</div>' : ""}
      <div class="src">Contenido de Wikipedia en español (CC BY-SA 4.0). Sotos lo consulta por la app, solo a es.wikipedia.org y api.wikimedia.org.</div></div>`;
  } catch (e) { loading("No se pudo abrir la portada: " + ap.esc(e.message)); }
}
async function search(v) {
  loading(`Buscando «${ap.esc(v.q)}»…`);
  try { const r = await get(`${W}/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(v.q)}&srlimit=15&format=json&utf8=1`);
    const it = r.query.search; $("#main").innerHTML = `<div class="res"><div style="cursor:default;border:0;background:none;padding:0" class="ap-faint">${r.query.searchinfo.totalhits.toLocaleString("es")} resultados</div>${it.map(x => `<div data-t="${ap.esc(x.title)}"><b>${ap.esc(x.title)}</b><span>${x.snippet.replace(/<(?!\/?span( class="searchmatch")?>)[^>]+>/g, "")}…</span></div>`).join("") || '<div style="cursor:default">Sin resultados</div>'}</div>`; }
  catch (e) { loading(ap.esc(e.message)); }
}
async function art(v) {
  loading(`Abriendo «${ap.esc(v.t.replace(/_/g, " "))}»…`);
  try {
    const [sum, html] = await Promise.all([get(`${W}/api/rest_v1/page/summary/${enc(v.t)}`).catch(() => null), get(`${W}/api/rest_v1/page/html/${enc(v.t)}`, true)]);
    const doc = new DOMParser().parseFromString(html, "text/html");
    doc.querySelectorAll("script,style,link,meta,iframe,object,embed,form,input,button,noscript").forEach(e => e.remove());
    doc.querySelectorAll("*").forEach(el => { for (const a of [...el.attributes]) { const n = a.name.toLowerCase(); if (n.startsWith("on") || n === "style" || n === "srcset" || n === "data-mw") el.removeAttribute(a.name); } });
    doc.querySelectorAll("img").forEach(img => { const s = img.getAttribute("src") || ""; if (s.startsWith("//")) img.src = "https:" + s; img.loading = "lazy"; });
    doc.querySelectorAll("a[href]").forEach(a => { const h = a.getAttribute("href"); if (h.startsWith("./")) { a.dataset.t = decodeURIComponent(h.slice(2).split("#")[0]); a.removeAttribute("href"); } else if (/^https?:|^\/\//.test(h)) { a.target = "_blank"; a.rel = "noopener noreferrer"; } else a.removeAttribute("href"); });
    const body = doc.body; const heads = [...body.querySelectorAll("h2")]; heads.forEach((h, i) => h.id = "s" + i);
    const title = sum?.title || v.t.replace(/_/g, " "); cur.title = title; cur.html = body.innerHTML; cur.summary = sum?.extract || "";
    $("#main").innerHTML = `<div class="art"><nav class="toc"><a data-sec="top"><b>${ap.esc(title)}</b></a>${heads.map((h, i) => `<a data-sec="s${i}">${ap.esc(h.textContent)}</a>`).join("")}</nav>
      <article class="content" id="art"><h1 id="top">${ap.esc(title)}</h1>${sum?.description ? `<div class="desc">${ap.esc(sum.description)}</div>` : ""}${body.innerHTML}
      <p class="src" style="margin-top:3em">Texto de Wikipedia, «${ap.esc(title)}» (CC BY-SA 4.0). <a href="${W}/wiki/${enc(v.t)}" target="_blank" rel="noopener noreferrer">Ver en Wikipedia</a></p></article></div>`;
    $("#star").textContent = favs.some(f => f.t === v.t) ? "★ Guardado" : "☆ Guardar"; sotos.window.setTitle("Enciclopedia · " + title).catch(() => {});
  } catch (e) { loading(ap.esc(e.message)); }
}
function showFavs() { $("#main").innerHTML = `<div class="res"><b style="cursor:default">Favoritos</b>${favs.length ? favs.map(f => `<div data-t="${ap.esc(f.t)}"><b>${ap.esc(f.title)}</b><span>${ap.esc(f.desc || "")}</span></div>`).join("") : '<div style="cursor:default" class="ap-muted">Aún no guardas artículos. Ábrelos y toca «☆ Guardar».</div>'}</div>`; }
$("#main").addEventListener("click", (e) => { const s = e.target.closest("[data-sec]"); if (s) { document.getElementById(s.dataset.sec)?.scrollIntoView({ behavior: "smooth" }); return; } const t = e.target.closest("[data-t]"); if (t) { e.preventDefault(); go({ kind: "art", t: t.dataset.t }); } });
$("#q").onkeydown = (e) => { if (e.key === "Enter" && e.target.value.trim()) go({ kind: "search", q: e.target.value.trim() }); };
$("#home").onclick = () => go({ kind: "home" }); $("#favs").onclick = () => go({ kind: "favs" });
$("#star").onclick = () => { const i = favs.findIndex(f => f.t === cur.t); if (i >= 0) favs.splice(i, 1); else favs.unshift({ t: cur.t, title: cur.title, desc: cur.summary.slice(0, 140) }); ap.store.set("favs", favs.slice(0, 200)); $("#star").textContent = i >= 0 ? "☆ Guardar" : "★ Guardado"; };
$("#saveDoc").onclick = () => { const html = `<!doctype html><html lang="es"><meta charset="utf-8"><title>${ap.esc(cur.title)}</title><body style="font:17px/1.6 Georgia,serif;max-width:780px;margin:30px auto;padding:0 16px"><h1>${ap.esc(cur.title)}</h1>${cur.html}<p><small>Texto de Wikipedia (CC BY-SA 4.0): ${W}/wiki/${enc(cur.t)}</small></p></body></html>`;
  ap.save(cur.title.replace(/[\\/:*?"<>|]/g, "_") + ".html", new Blob([html], { type: "text/html" })); };
(async () => { await ap.ready; favs = (await ap.store.get("favs")) || []; go({ kind: "home" }, false); })();
</script>
</body>
</html>
