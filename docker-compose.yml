# Sotos — server (VPS) deployment with Docker, domain + HTTPS
# © 2026 Sebastian Sotomontes
#
#   cp .env.example .env   (fill in domains and secret)
#   docker compose up -d --build
#
# Needs three subdomains pointing to the server (A/AAAA records):
#   SOTOS_DOMAIN   the desktop        e.g. os.example.com
#   PX_DOMAIN      browser proxy      e.g. px.example.com
#   OFFICE_DOMAIN  ONLYOFFICE         e.g. office.example.com
# Caddy obtains and renews the HTTPS certificates automatically.

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SOTOS_DOMAIN: ${SOTOS_DOMAIN}
      PX_DOMAIN: ${PX_DOMAIN}
      OFFICE_DOMAIN: ${OFFICE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [sotos, onlyoffice]

  sotos:
    build: .
    restart: unless-stopped
    environment:
      PX_HOST: ${PX_DOMAIN}
      PX_PUBLIC: https://${PX_DOMAIN}
      TRUST_PROXY: "1"
      OO_URL: https://${OFFICE_DOMAIN}
      OO_INTERNAL: http://onlyoffice
      SOTOS_INTERNAL: http://sotos:8787
      SOTOS_OO_JWT: ${OO_JWT_SECRET}
      SOTOS_REGISTRATION: ${SOTOS_REGISTRATION:-open}
      SOTOS_VAULT_ADMIN: ${SOTOS_VAULT_ADMIN:-0}
      SOTOS_QUOTA_MB: ${SOTOS_QUOTA_MB:-2048}
    volumes:
      - sotos_data:/data

  onlyoffice:
    image: onlyoffice/documentserver:${OO_VERSION:-latest}
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${OO_JWT_SECRET}
      JWT_HEADER: Authorization
      ALLOW_PRIVATE_IP_ADDRESS: "true"   # lets it download files from "sotos" over the internal network
    volumes:
      - oo_data:/var/www/onlyoffice/Data
      - oo_lib:/var/lib/onlyoffice
      - oo_db:/var/lib/postgresql

volumes:
  caddy_data:
  caddy_config:
  sotos_data:
  oo_data:
  oo_lib:
  oo_db:
